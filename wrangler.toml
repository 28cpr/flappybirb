name = "flappy-roguelite"
compatibility_date = "2024-11-01"
pages_build_output_dir = "public"

# Global scoreboard storage.
#
# With a wrangler.toml present, Cloudflare treats this file as the source of
# truth for Pages bindings and disables editing them in the dashboard — so the
# namespace ids have to live here.
#
# Create a namespace under Storage & Databases -> KV, then paste its id below.
# Ids must be 32-char hex; a placeholder here fails the build with
# "Error 8000022: Invalid KV namespace ID".
[[kv_namespaces]]
binding = "SCORES"
id = "f5ee632ff1ce443c9e557b81dfbd58af"
preview_id = "f5ee632ff1ce443c9e557b81dfbd58af"
