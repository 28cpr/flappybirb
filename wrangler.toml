name = "flappy-roguelite"
compatibility_date = "2024-11-01"
pages_build_output_dir = "public"

# The global scoreboard needs a KV namespace bound as SCORES.
#
# For Pages, bind it in the dashboard — that is what production actually uses:
#   Workers & Pages -> your project -> Settings -> Bindings -> Add -> KV
#   Variable name: SCORES   (add it for BOTH Production and Preview)
#
# No binding is required for the site to work: the API reports itself as
# unconfigured and the game falls back to local-only scores.
#
# Only for local `wrangler pages dev` do you need ids here. Create them with
#   npx wrangler kv namespace create SCORES
#   npx wrangler kv namespace create SCORES --preview
# then uncomment and paste the ids:
#
# [[kv_namespaces]]
# binding = "SCORES"
# id = "paste-the-32-char-hex-id-here"
# preview_id = "paste-the-preview-id-here"
